databases:
  - name: material-list-db
    plan: free
    databaseName: material_list
    user: material_list_user

services:
  - type: web
    name: material-list
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: material-list-db
          property: connectionString
      - key: NODE_ENV
        value: production
